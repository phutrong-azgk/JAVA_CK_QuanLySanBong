<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::section})}">
<head>
    <title>Quản lý Sân Bóng</title>
</head>
<body>
<section>
    <div class="page-header">
        <div class="d-flex justify-content-between align-items-center">
            <h2 class="page-title">Quản lý Sân Bóng</h2>
            <div sec:authorize="hasRole('ADMIN')">
                <button class="btn btn-primary" onclick="showAddTableModal()">
                    <i class="fas fa-plus"></i> Thêm sân
                </button>
            </div>
        </div>
    </div>

    <div id="tablesGrid" class="row">
    </div>

    <div class="modal fade" id="tableModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Thêm sân mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="tableForm">
                        <input type="hidden" id="maSan" name="maSan"/>
                        <div class="mb-3">
                            <label class="form-label">Tên sân <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="tenSan" name="tenSan" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Giá giờ <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="gia" name="gia" min="0" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Trạng thái</label>
                            <select id="trangThai" name="trangThai" class="form-select">
                                <option value="Trống">Trống</option>
                                <option value="Bảo Trì">Bảo Trì</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" onclick="saveTable()">Lưu</button>
                </div>
            </div>
        </div>

    </div>

    <div class="modal fade" id="startSessionModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title"><i class="fas fa-play-circle me-2"></i>Mở Sân</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="startMaSan" />
                    <div class="mb-3">
                        <label class="form-label fw-bold">Chọn khách hàng</label>
                        <select id="startMaKhach" class="form-select">
                        </select>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-success" onclick="confirmStartSession()">Bắt đầu</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="endSessionModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title"><i class="fas fa-calculator me-2"></i>Thanh Toán</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="endMaSan" />
                    <p>Chốt hóa đơn cho: <strong id="endTenSan" class="text-danger"></strong></p>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Áp dụng Khuyến mãi</label>
                        <select id="endKhuyenMai" class="form-select">
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Phương thức thanh toán</label>
                        <div class="btn-group w-100" role="group">
                            <input type="radio" class="btn-check" name="hinhThuc" id="cash" value="Tiền mặt" checked>
                            <label class="btn btn-outline-success" for="cash"><i class="fas fa-wallet me-1"></i>Tiền mặt</label>

                            <input type="radio" class="btn-check" name="hinhThuc" id="bank" value="Chuyển khoản">
                            <label class="btn btn-outline-primary" for="bank"><i class="fas fa-university me-1"></i>Chuyển khoản</label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-danger" onclick="confirmEndSession()">Chốt thanh toán</button>
                </div>
            </div>
        </div>
    </div>

        <div class="modal fade" id="qrModal" tabindex="-1" data-bs-backdrop="static">
            <div class="modal-dialog modal-sm modal-dialog-centered">
                <div class="modal-content border-0 shadow">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title"><i class="fas fa-qrcode me-2"></i>Quét mã thanh toán</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body text-center">
                        <p class="text-muted mb-2">Vui lòng yêu cầu khách quét mã</p>
                        <img src="https://img.vietqr.io/image/MB-0123456789-compact2.png" alt="QR Code" class="img-fluid border rounded p-2 mb-3" style="max-width: 200px;">
                        <p class="fw-bold text-danger mb-0">Đang chờ thanh toán...</p>
                    </div>
                    <div class="modal-footer bg-light justify-content-center">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="button" class="btn btn-primary" onclick="processPayment()">Xác nhận đã nhận tiền</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="successModal" tabindex="-1">
            <div class="modal-dialog modal-sm modal-dialog-centered">
                <div class="modal-content border-0 shadow text-center">
                    <div class="modal-body p-4">
                        <i class="fas fa-check-circle text-success" style="font-size: 60px; margin-bottom: 15px;"></i>
                        <h4 class="text-success fw-bold">Thành Công!</h4>
                        <p id="successMessage" class="text-muted mb-4">Giao dịch đã được ghi nhận.</p>
                        <button type="button" class="btn btn-success w-100 px-4" data-bs-dismiss="modal">Đóng</button>
                    </div>
                </div>
            </div>
        </div>

    <div class="modal fade" id="bookingDetailModal" tabindex="-1">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-warning text-dark py-2">
                    <h6 class="modal-title fw-bold mb-0"><i class="fas fa-user-circle me-2"></i>Thông tin người đặt</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-3">
                    <div class="mb-2">
                        <small class="text-muted d-block">Họ và tên:</small>
                        <strong id="viewTenKhach" class="text-dark"></strong>
                    </div>
                    <div class="mb-2">
                        <small class="text-muted d-block">Số điện thoại:</small>
                        <strong id="viewSoDienThoai" class="text-dark"></strong>
                    </div>
                    <div class="mb-0">
                        <small class="text-muted d-block">Email:</small>
                        <strong id="viewEmail" class="text-dark text-break"></strong>
                    </div>
                </div>
                <div class="modal-footer bg-light p-2">
                    <button type="button" class="btn btn-sm btn-secondary w-100" data-bs-dismiss="modal">Đóng</button>
                </div>
            </div>
        </div>
    </div>

    <style>
        .table-card { border: 2px solid #e5e7eb; border-radius: 12px; padding: 20px; transition: all 0.3s; background: #fff; height: 100%; display: flex; flex-direction: column; }
        .table-card:hover { box-shadow: 0 4px 15px rgba(0,0,0,0.1); transform: translateY(-2px); }
        .table-card.available { border-color: #10b981; background: #ecfdf5; }
        .table-card.occupied { border-color: #ef4444; background: #fef2f2; }
        .table-card.reserved { border-color: #f59e0b; background: #fffbeb; }
        .table-name { font-size: 22px; font-weight: bold; color: #1f2937; margin-bottom: 5px; }
        .table-price { color: #6b7280; font-size: 14px; margin-bottom: 15px; }
        .status-badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 10px; }
        .status-badge.available { background: #d1fae5; color: #065f46; }
        .status-badge.occupied { background: #fee2e2; color: #991b1b; }
        .status-badge.reserved { background: #fef3c7; color: #92400e; }
        .session-info { background: rgba(255,255,255,0.6); padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px dashed #ccc; min-height: 70px; display: flex; flex-direction: column; justify-content: center; }
        .card-buttons { margin-top: auto; } /* Bí quyết đẩy các nút bấm luôn luôn nằm sát đáy thẻ */
        .table-card.maintenance { border-color: #6b7280; background: #f3f4f6; }
        .status-badge.maintenance { background: #e5e7eb; color: #374151; }
    </style>


    <script th:inline="javascript">
        let tables = [];
        let editingTable = null;

        const isAdmin = /*[[${#authorization.expression('hasRole(''ADMIN'')')}]]*/ false;
        // Thêm biến isStaff cho Nhân viên
        const isStaff = /*[[${#authorization.expression('hasAnyRole(''ADMIN'', ''NHAN_VIEN'')')}]]*/ false;

        $(document).ready(function () {
            loadTables();
        });

        function loadTables() {
            $.get('/san/api/get-all', function (data) {
                tables = data;
                renderTables();
            });
        }

        function renderTables() {
            const grid = $('#tablesGrid');
            grid.empty();

            tables.forEach(table => {
                const isOccupied = (table.trangThai === 'Đang Chơi');
                const isReserved = (table.trangThai === 'Đặt Trước');
                const isMaintenance = (table.trangThai === 'Bảo Trì');
                const cardClass = isOccupied ? 'occupied' : (isReserved ? 'reserved' : (isMaintenance ? 'maintenance' : 'available'));
                const statusText = isOccupied ? 'Đang có khách' : (isReserved ? 'Đã đặt chỗ' : (isMaintenance ? 'Đang bảo trì' : 'Sân Trống'));

                let sessionHtml = '';
                if (isOccupied) {
                    sessionHtml = `
                        <div class="session-info text-danger small">
                            Sân đang sử dụng<br>
                            Sử dụng: <a href="javascript:void(0)" class="fw-bold text-danger text-decoration-none" onclick="showBookingDetail('${table.tenKhach}', '${table.soDienThoai}', '${table.email}')">${table.tenKhach} <i class="fas fa-search ms-1" style="font-size:10px;"></i></a>
                        </div>`;
                } else if (isReserved) {
                    sessionHtml = `
                        <div class="session-info text-warning small">
                            Khách đã đặt trước<br>
                            Người đặt: <a href="javascript:void(0)" class="fw-bold text-warning text-decoration-none" onclick="showBookingDetail('${table.tenKhach}', '${table.soDienThoai}', '${table.email}')">${table.tenKhach} <i class="fas fa-search ms-1" style="font-size:10px;"></i></a>
                        </div>`;
                }
                else if (isMaintenance) {
                    sessionHtml = `<div class="session-info text-secondary small">Sân đang được bảo dưỡng định kỳ.<br>Tạm thời ngừng đón khách.</div>`;
                }
                else {
                    sessionHtml = `<div class="session-info text-success">Sân đang trống</div>`;
                }

                let buttonsHtml = '';
                // 1. Chỉ ADMIN mới có nút Sửa/Xóa
                if (isAdmin) {
                    buttonsHtml += `
                        <div class="btn-group w-100 mb-2">
                            <button class="btn btn-sm btn-outline-warning" onclick='editTable(${JSON.stringify(table)})'>Sửa</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteTable(${table.maSan})">Xóa</button>
                        </div>
                    `;
                }

                // 2. NHÂN VIÊN VÀ ADMIN đều ấn được các nút Vận hành (Bắt đầu, Tính tiền)
                if (table.trangThai === 'Trống') {
                    if (isStaff) {
                        buttonsHtml += `<button class="btn btn-success w-100" onclick="startSession(${table.maSan})"><i class="fas fa-play"></i> Bắt đầu</button>`;
                    }
                    else if (isMaintenance) {
                    buttonsHtml += `<button class="btn btn-secondary w-100" disabled><i class="fas fa-tools me-1"></i> Tạm dừng hoạt động</button>`;
                    }
                    else {
                        buttonsHtml += `<button class="btn btn-info text-white w-100" onclick="bookSession(${table.maSan})"><i class="fas fa-calendar-check"></i> Đặt Sân</button>`;
                    }
                } else if (isReserved) {
                    if (isStaff) {
                        // Thêm nút Hủy (Màu đỏ) nằm cạnh nút Bắt đầu
                        buttonsHtml += `
                            <div class="d-flex gap-2 w-100">
                                <button class="btn btn-warning w-75" onclick="startSession(${table.maSan})"><i class="fas fa-play"></i> Khách tới</button>
                                <button class="btn btn-outline-danger w-25" onclick="cancelBooking(${table.maSan})" title="Khách bom sân (Hủy lịch)"><i class="fas fa-times"></i></button>
                            </div>`;
                    } else {
                        buttonsHtml += `<button class="btn btn-secondary w-100" disabled>Sân đã được đặt</button>`;
                    }
                } else if (isOccupied) {
                    if (isStaff) {
                        buttonsHtml += `<button class="btn btn-primary w-100" onclick="endSession(${table.maSan}, '${table.tenSan}')">Tính Tiền</button>`;
                    } else {
                        buttonsHtml += `<button class="btn btn-danger w-100" disabled>Đang có khách đá</button>`;
                    }
                }

                const cardHtml = `
                    <div class="col-md-6 col-lg-3 mb-4">
                        <div class="table-card ${cardClass}">
                            <div class="d-flex justify-content-between align-items-start">
                                <div class="table-name">${table.tenSan}</div>
                                <span class="status-badge ${cardClass}">${statusText}</span>
                            </div>
                            <div class="table-price">${new Intl.NumberFormat('vi-VN').format(table.gia)} đ/giờ</div>
                            ${sessionHtml}
                            <div class="card-buttons">
                                ${buttonsHtml}
                            </div>
                        </div>
                    </div>
                `;
                grid.append(cardHtml);
            });
        }

        // ... CÁC HÀM XỬ LÝ KHÁC GIỮ NGUYÊN BÊN DƯỚI ...

        // --- CÁC HÀM XỬ LÝ SÂN (Đã đưa ra ngoài để hoạt động được) ---

        // Hàm 1: Mở Modal thay vì gọi API ngay lập tức
        function startSession(maSan) {
            $('#startMaSan').val(maSan);

            // Gọi API lấy danh sách khách hàng (Đảm bảo bạn đã có API này, nếu dùng tên khác hãy sửa lại URL)
            $.get('/khach/api/get-all', function (customers) {
                const select = $('#startMaKhach');
                select.empty();

                // Mặc định luôn có tùy chọn Khách vãng lai
                select.append('<option value="">-- Khách vãng lai --</option>');

                if(customers && customers.length > 0) {
                    customers.forEach(kh => {
                        select.append(`<option value="${kh.maKhach}">${kh.tenKhach} - ${kh.soDienThoai || ''}</option>`);
                    });
                }
                $('#startSessionModal').modal('show');
            }).fail(function() {
                // Đề phòng API lỗi hoặc chưa viết, vẫn cho phép mở sân dưới dạng Khách vãng lai
                $('#startMaKhach').html('<option value="">-- Khách vãng lai --</option>');
                $('#startSessionModal').modal('show');
            });
        }

        // Hàm 2: Gửi dữ liệu xuống Server khi người dùng bấm nút "Bắt đầu" trong Modal
        function confirmStartSession() {
            const maSan = $('#startMaSan').val();
            const maKhach = $('#startMaKhach').val();

            $.post('/san/api/start', { maSan: maSan, maKhach: maKhach }, function(res) {
                if(res.success) {
                    $('#startSessionModal').modal('hide');
                    loadTables(); // Load lại lưới để cập nhật màu đỏ (Đang chơi)
                } else {
                    alert(res.message || "Không thể bắt đầu!");
                }
            });
        }

        function endSession(maSan, tenSan) {
            $('#endMaSan').val(maSan);
            $('#endTenSan').text(tenSan);

            // Tải danh sách Khuyến mãi từ DB lên
            $.get('/khuyenmai/api/get-all', function(promos) {
                const select = $('#endKhuyenMai');
                select.empty();
                select.append('<option value="">-- Không sử dụng khuyến mãi --</option>');

                const now = new Date();
                promos.forEach(p => {
                    // Chỉ hiển thị các khuyến mãi đang trong thời hạn
                    const start = new Date(p.ngayBatDau);
                    const end = new Date(p.ngayKetThuc);
                    if (now >= start && now <= end) {
                        select.append(`<option value="${p.maKm}">${p.tenKm} (-${p.phanTramGiam}%)</option>`);
                    }
                });

                $('#endSessionModal').modal('show');
            });
        }

        function confirmEndSession() {
            const hinhThuc = $('input[name="hinhThuc"]:checked').val();

            if (hinhThuc === 'Chuyển khoản') {
                // Đóng form tính tiền
                $('#endSessionModal').modal('hide');

                // DÙNG SETTIMEOUT ĐỂ TRÁNH LỖI KẸT MÀN HÌNH
                setTimeout(() => {
                    // Tích hợp QR Động (VietQR)
                    const nganHang = 'MB'; // Tên viết tắt ngân hàng của bạn
                    const soTaiKhoan = '0123456789'; // Số tài khoản thật
                    const tenSan = $('#endTenSan').text();
                    const noiDung = 'Thanh toan ' + tenSan.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ /g, '');

                    const soTien = 100000; // Giả định số tiền

                    const qrUrl = `https://img.vietqr.io/image/${nganHang}-${soTaiKhoan}-compact2.png?amount=${soTien}&addInfo=${encodeURIComponent(noiDung)}`;

                    $('#qrModal img').attr('src', qrUrl);
                    $('#qrModal').modal('show');
                }, 400); // Đợi 400ms

            } else {
                processPayment();
            }
        }

        function processPayment() {
            const maSan = $('#endMaSan').val();
            const maKm = $('#endKhuyenMai').val();
            const hinhThuc = $('input[name="hinhThuc"]:checked').val();

            $.post('/san/api/end', { maSan: maSan, maKm: maKm, hinhThuc: hinhThuc }, function(res) {
                if(res.success) {
                    $('#endSessionModal').modal('hide');
                    $('#qrModal').modal('hide');

                    // DÙNG SETTIMEOUT ĐỂ TRÁNH LỖI KẸT MÀN HÌNH
                    setTimeout(() => {
                        $('#successMessage').text(res.message);
                        $('#successModal').modal('show');
                        loadTables();
                    }, 400); // Đợi 400ms
                } else {
                    alert("Thanh toán thất bại: " + res.message);
                }
            });
        }

        function bookSession(maSan) {
            if(confirm('Xác nhận đặt trước sân này?')) {
                $.post('/san/api/book', { maSan: maSan }, function(res) {
                    alert(res.message);
                    if(res.success) loadTables();
                });
            }
        }

        // --- CÁC HÀM CRUD ---
        function showAddTableModal() {
            editingTable = null;
            $('#modalTitle').text('Thêm sân mới');
            $('#tableForm')[0].reset();
            $('#maSan').val('');

            // Sân mới tạo mặc định luôn luôn là Trống
            $('#trangThai').val('Trống').css('pointer-events', 'none').css('background-color', '#e9ecef');
            $('#tableModal').modal('show');
        }

        function editTable(table) {
            editingTable = table;
            $('#modalTitle').text('Chỉnh sửa sân');
            $('#maSan').val(table.maSan);
            $('#tenSan').val(table.tenSan);
            $('#gia').val(table.gia);
            $('#trangThai').val(table.trangThai);

            // Nếu sân đang Trống hoặc đang Bảo Trì -> Cho phép Admin chuyển đổi qua lại
            if (table.trangThai === 'Trống' || table.trangThai === 'Bảo Trì') {
                $('#trangThai').css('pointer-events', 'auto').css('background-color', '#fff');
            } else {
                // Sân đang có khách đá hoặc đặt trước -> Khóa cứng lại bảo vệ luồng tiền
                $('#trangThai').css('pointer-events', 'none').css('background-color', '#e9ecef');
            }
            $('#tableModal').modal('show');
        }

        function saveTable() {
            const data = $('#tableForm').serialize();
            const url = editingTable ? '/san/api/edit' : '/san/api/create';

            $.post(url, data, function(res) {
                if(res.success) {
                    $('#tableModal').modal('hide');
                    loadTables();
                } else {
                    alert(res.message);
                }
            });
        }

        function deleteTable(id) {
            if(confirm('Bạn có chắc chắn muốn xóa sân này?')) {
                $.post('/san/api/delete', { maSan: id }, function(res) {
                    if(res.success) {
                        loadTables();
                    } else {
                        alert(res.message);
                    }
                });
            }
        }

        function showBookingDetail(ten, sdt, email) {
            $('#viewTenKhach').text(ten);
            $('#viewSoDienThoai').text(sdt);
            $('#viewEmail').text(email);
            $('#bookingDetailModal').modal('show');
        }

        function cancelBooking(maSan) {
            if(confirm('Khách không đến? Bạn muốn HỦY lịch đặt trước của sân này và mở lại cho khách khác thuê?')) {
                $.post('/san/api/cancel-booking', { maSan: maSan }, function(res) {
                    if(res.success) {
                        loadTables(); // Load lại lưới để cập nhật sân thành Trống (màu xanh)
                    } else {
                        alert(res.message);
                    }
                });
            }
        }
    </script>
</section>
</body>
</html>
