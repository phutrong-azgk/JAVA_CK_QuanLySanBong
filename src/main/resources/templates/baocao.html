<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">
<head>
    <title>Báo cáo thống kê</title>
</head>
<body>
<section>
    <div class="page-header mb-4">
        <h2 class="page-title"><i class="fas fa-chart-bar me-2"></i>Báo cáo thống kê</h2>
    </div>

    <div class="card mb-4 shadow-sm border-0">
        <div class="card-body row">
            <div class="col-md-3">
                <label class="fw-bold">Từ ngày</label>
                <input type="date" class="form-control" id="startDate" />
            </div>
            <div class="col-md-3">
                <label class="fw-bold">Đến ngày</label>
                <input type="date" class="form-control" id="endDate" />
            </div>
            <div class="col-md-3 d-flex align-items-end">
                <button class="btn btn-primary w-100" onclick="loadRevenue()"><i class="fas fa-search"></i> Lọc dữ liệu</button>
            </div>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card bg-success text-white shadow-sm border-0">
                <div class="card-body d-flex align-items-center">
                    <div class="display-4 me-3"><i class="fas fa-dollar-sign"></i></div>
                    <div>
                        <h6>Tổng doanh thu</h6>
                        <h3 class="fw-bold mb-0" id="totalRevenue">0 đ</h3>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-info text-white shadow-sm border-0">
                <div class="card-body d-flex align-items-center">
                    <div class="display-4 me-3"><i class="fas fa-receipt"></i></div>
                    <div>
                        <h6>Số hóa đơn</h6>
                        <h3 class="fw-bold mb-0" id="totalBills">0</h3>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-primary text-white shadow-sm border-0">
                <div class="card-body d-flex align-items-center">
                    <div class="display-4 me-3"><i class="fas fa-chart-line"></i></div>
                    <div>
                        <h6>Trung bình/hóa đơn</h6>
                        <h3 class="fw-bold mb-0" id="averageBill">0 đ</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-white"><h5 class="mb-0 fw-bold">Biểu đồ doanh thu</h5></div>
        <div class="card-body">
            <canvas id="revenueChart" height="80"></canvas>
        </div>
    </div>

    <div class="card shadow-sm border-0 mt-4 mb-4">
        <div class="card-header bg-white"><h5 class="mb-0 fw-bold">Chi tiết lịch sử hóa đơn</h5></div>
        <div class="card-body">
            <table id="invoiceTable" class="table table-striped table-hover align-middle w-100">
                <thead class="table-dark">
                <tr>
                    <th>Mã HĐ</th>
                    <th>Thời Gian</th>
                    <th>Sân Bóng</th>
                    <th>Khách Hàng</th>
                    <th>Hình Thức</th>
                    <th>Tổng Tiền</th>
                    <th>Trạng Thái</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:inline="javascript">
        let revenueChart = null;

        $(document).ready(function () {
            const today = new Date();
            const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
            $('#startDate').val(firstDay.toISOString().split('T')[0]);
            $('#endDate').val(today.toISOString().split('T')[0]);
            loadRevenue();

            $('#invoiceTable').DataTable({
                ajax: {
                    url: '/baocao/api/hoadon',
                    dataSrc: ''
                },
                columns: [
                    {
                        data: 'maHD',
                        render: function(data, type) {
                            // Nếu DataTables đang cần lấy dữ liệu để hiển thị (display) lên màn hình
                            if (type === 'display') {
                                return '<b class="text-primary">#' + data + '</b>';
                            }
                            // Còn nếu nó đang cần lấy dữ liệu để Sắp xếp (sort) hoặc Tìm kiếm (filter) thì trả về con số gốc
                            return data;
                        }
                    },
                    {
                        data: 'thoiGian',
                        render: function(data, type, row) {
                            if (type === 'sort') return row.thoiGianRaw;
                            return data;
                        }
                    },
                    {
                        data: 'tenSan',
                        render: function(data) {
                            return '<span class="fw-bold text-dark">' + data + '</span>';
                        }
                    },
                    { data: 'tenKhach' },
                    {
                        data: 'hinhThuc',
                        render: function(data) {
                            if (data === 'Tiền mặt') return '<span class="badge bg-success"><i class="fas fa-wallet me-1"></i> Tiền mặt</span>';
                            if (data === 'Chuyển khoản') return '<span class="badge bg-primary"><i class="fas fa-university me-1"></i> Chuyển khoản</span>';
                            return data;
                        }
                    },
                    {
                        data: 'tongTien',
                        className: 'text-end fw-bold text-success',
                        render: $.fn.dataTable.render.number('.', ',', 0, '', ' đ')
                    },
                    {
                        data: 'trangThai',
                        render: function(data) {
                            if (data === 'Đã Thanh Toán') return '<span class="badge bg-success">Đã Thanh Toán</span>';
                            if (data === 'Đã Hủy') return '<span class="badge bg-danger">Đã Hủy</span>';
                            if (data === 'Đang Chơi') return '<span class="badge bg-danger">Đang Chơi</span>';
                            return '<span class="badge bg-warning text-dark">' + data + '</span>';
                        }
                    }
                ],
                order: [ [0, 'desc'] ], // Mặc định hóa đơn mới nhất xếp trên cùng
                language: {
                    url: '//cdn.datatables.net/plug-ins/1.13.6/i18n/vi.json'
                },
                pageLength: 10
            });
        });

        function loadRevenue() {
            // Lấy giá trị ngày từ ô input
            const startDate = $('#startDate').val();
            const endDate = $('#endDate').val();

            // Gửi kèm startDate và endDate xuống Controller
            $.get('/baocao/api/doanh-thu', { startDate: startDate, endDate: endDate }, function (data) {
                $('#totalRevenue').text(formatCurrency(data.totalRevenue));
                $('#totalBills').text(data.totalBills);
                $('#averageBill').text(formatCurrency(data.averageBill));

                // Vẽ biểu đồ
                renderRevenueChart(data.dailyRevenue);
            });
        }
        function renderRevenueChart(data) {
            const ctx = document.getElementById('revenueChart').getContext('2d');
            if (revenueChart) revenueChart.destroy();

            revenueChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => d.date),
                    datasets: [{
                        label: 'Doanh thu (VNĐ)',
                        data: data.map(d => d.revenue),
                        backgroundColor: '#3b82f6',
                        borderRadius: 4
                    }]
                },
                options: { responsive: true }
            });
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND', maximumFractionDigits: 0 }).format(Math.round(amount));
        }
    </script>
</section>
</body>
</html>
